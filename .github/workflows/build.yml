name: build

# Every push: unit tests + bot simulation, then web build (GitHub Pages) and Android debug APK (Releases).
#  - https://<owner>.github.io/<repo>/                 latest push from any branch
#  - https://<owner>.github.io/<repo>/branch/<name>/   latest push of that branch
#  - Releases → "build-<branch>"                       debug APK for that branch

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          V=$(cat .godot-version)
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mkdir -p "$HOME/bin" && mv "Godot_v${V}-stable_linux.x86_64" "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Import project
        run: godot --headless --import --path . || true
      - name: Unit tests
        run: godot --headless --path . --script res://tests/run_tests.gd
      - name: UI smoke test (2 full runs through the real UI)
        run: timeout 600 godot --headless --path . --script res://tests/ui_smoke.gd -- --runs 2
      - name: Simulation (5000 runs)
        run: |
          godot --headless --path . --script res://sim/run_sim.gd -- --runs 5000 --all --out sim_report.md
          { echo '## Bot simulation'; echo '```'; cat sim_report.md; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  export:
    name: Export web + Android
    needs: test
    runs-on: ubuntu-latest
    # All branches publish to the same gh-pages branch: deploy one run at a time.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Branch name
        run: echo "BRANCH_SLUG=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr -cd '[:alnum:]._-')" >> "$GITHUB_ENV"
      - name: Build info (for the in-game update check)
        run: |
          printf '{"sha": "%s", "branch": "%s", "repo": "%s"}\n' "${{ github.sha }}" "$BRANCH_SLUG" "${{ github.repository }}" > config/build.json
          cat config/build.json
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ hashFiles('.godot-version') }}
      - name: Install Godot + export templates
        run: |
          V=$(cat .godot-version)
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mkdir -p "$HOME/bin" && mv "Godot_v${V}-stable_linux.x86_64" "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          T="$HOME/.local/share/godot/export_templates/${V}.stable"
          if [ ! -f "$T/web_nothreads_release.zip" ]; then
            curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
            mkdir -p "$T" && unzip -q tpl.tpz -d tpl && mv tpl/templates/* "$T/" && rm -rf tpl tpl.tpz
          fi
          ls "$T"
      - name: Import project
        run: |
          mkdir -p build && touch build/.gdignore
          godot --headless --import --path . || true
      - name: Export web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.wasm
          cp config/build.json build/web/version.json   # what the installed app compares itself with
      - name: Deploy web to gh-pages (latest + branch copy, with retries)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages
          rsync -a build/web/ pages/                                   # root = latest push from any branch
          mkdir -p "pages/branch/${BRANCH_SLUG}"
          rsync -a --delete build/web/ "pages/branch/${BRANCH_SLUG}/"  # per-branch copy
          touch pages/.nojekyll
          cd pages
          git add -A
          git commit -q -m "web: ${{ github.ref_name }} ${{ github.sha }}" || { echo "nothing to deploy"; exit 0; }
          for i in 1 2 3 4 5; do
            if git push origin gh-pages; then exit 0; fi
            echo "push failed (attempt $i), retrying"
            sleep $((i * 15))
            git pull --rebase origin gh-pages || true
          done
          exit 1
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Export Android debug APK
        run: |
          V=$(cat .godot-version)
          MAJ=$(echo "$V" | cut -d. -f1-2)
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${MAJ}.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          cp "$HOME/.config/godot/editor_settings-${MAJ}.tres" "$HOME/.config/godot/editor_settings-4.tres"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/RogueCards.apk
          ls -la build/android
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${BRANCH_SLUG}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" build/android/RogueCards.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Build ${{ github.ref_name }}" \
            --notes "Debug APK from ${{ github.sha }}. Web: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branch/${BRANCH_SLUG}/"
