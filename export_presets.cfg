html/head_include="<meta name=\"theme-color\" content=\"#efe4cb\"><link rel=\"apple-touch-icon\" href=\"index.180x180.png\"><meta name=\"apple-mobile-web-app-title\" content=\"RogueCards\"><style>body, #status { background-color: #efe4cb !important; }#status-progress { -webkit-appearance: none; appearance: none; height: 8px !important; background-color: #e3d4b3 !important; border: 1px solid #b89c6a !important; border-radius: 4px !important; box-shadow: none !important; padding: 0 !important; }#status-progress::-webkit-progress-bar { background-color: #e3d4b3; border-radius: 4px; }#status-progress::-webkit-progress-value { background-color: #9c6b1c; border-radius: 4px; }#status-progress::-moz-progress-bar { background-color: #9c6b1c; border-radius: 4px; }#status-notice { background-color: #f4ead2 !important; border: 1px solid #9a2f24 !important; color: #33261a !important; border-radius: 8px !important; font-family: Georgia, 'Times New Roman', serif !important; }</style><script>(function(){var K='rcReloads';function reload(){try{var n=JSON.parse(sessionStorage.getItem(K)||'[]').filter(function(t){return Date.now()-t<60000;});if(n.length>=3)return;n.push(Date.now());sessionStorage.setItem(K,JSON.stringify(n));}catch(e){}location.reload();}var lost=false;function hook(){var c=document.getElementById('canvas');if(c)c.addEventListener('webglcontextlost',function(){lost=true;if(document.visibilityState==='visible')setTimeout(reload,500);},false);}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hook);else hook();document.addEventListener('visibilitychange',function(){if(document.visibilityState!=='visible')return;if(lost){reload();return;}var since=Date.now();setTimeout(function(){var b=window.rcBeat;if(document.visibilityState==='visible'&&b&&b<since)reload();},4000);});window.addEventListener('pageshow',function(e){if(e.persisted&&window.rcBeat)reload();});})();</script>"
